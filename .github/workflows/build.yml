name: Build Android App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: وەرگرتنی کۆدەکان
      uses: actions/checkout@v4

    - name: ئامادەکردنی ژینگەی جاڤا
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: پێدانی مۆڵەتی کارپێکردن
      run: chmod +x gradlew
      working-directory: ./8BPGlass

    - name: دروستکردنی بەرنامەکە
      run: ./gradlew assembleDebug
      working-directory: ./8BPGlass

    - name: ئامادەکردنی پەڕگەکە بۆ داگرتن
      uses: actions/upload-artifact@v4
      with:
        name: App-APK
        path: 8BPGlass/app/build/outputs/apk/debug/app-debug.apk

